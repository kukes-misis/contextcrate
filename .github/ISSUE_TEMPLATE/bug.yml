name: Сообщить об ошибке
description: Опишите воспроизводимую ошибку на безопасном примере.
title: "Ошибка: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Сообщение будет публичным. Используйте вымышленный пример. Не загружайте закрытый проект, настоящие учётные данные и пакеты с конфиденциальной информацией.
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      placeholder: "1. Импортируйте тестовую папку ...\n2. Выберите ...\n3. Экспортируйте ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Браузер и операционная система
      placeholder: Safari на macOS
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Небольшой тестовый пример или скриншот
      description: Перед отправкой удалите персональные данные и настоящие секреты.
