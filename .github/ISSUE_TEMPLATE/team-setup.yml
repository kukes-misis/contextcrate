name: Настройка для команды
description: Обсудить подготовку заданий для агентов и настройку процесса в вашей команде.
title: "Настройка: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Это публичная заявка, а не покупка или договор поддержки. Не публикуйте закрытый код, данные клиентов, секреты, учётные данные и внутренние ссылки. Стоимость, сроки и объём согласуются отдельно. Оплата здесь не принимается.
  - type: input
    id: team
    attributes:
      label: Команда или проект
      description: Достаточно публичного названия или общего описания.
      placeholder: Небольшая продуктовая команда на TypeScript
    validations:
      required: true
  - type: dropdown
    id: team-size
    attributes:
      label: Сколько человек используют AI-агентов
      options:
        - "1–5"
        - "6–15"
        - "16–50"
        - "Больше 50"
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Что вы хотите улучшить в передаче задач агентам?
      description: Опишите стек, текущий процесс и желаемый результат без закрытого кода.
      placeholder: Нам нужны шаблоны заданий на исправление ошибок с нужными тестами и критериями проверки.
    validations:
      required: true
  - type: dropdown
    id: interest
    attributes:
      label: Что вас интересует?
      options:
        - Настройка проекта и шаблоны заданий
        - Регулярное сопровождение шаблонов
        - Оба варианта
        - Только обсуждение бесплатного инструмента
  - type: textarea
    id: timing
    attributes:
      label: Сроки и ограничения
      description: Необязательно. Срок выполнения согласуется отдельно.
  - type: checkboxes
    id: public-information
    attributes:
      label: Публичность данных
      options:
        - label: Я понимаю, что заявка публичная, и не включаю конфиденциальные данные.
          required: true
